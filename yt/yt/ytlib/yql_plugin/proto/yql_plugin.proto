package NYT.NYqlPlugin.NProto;

import "yt_proto/yt/core/misc/proto/guid.proto";
import "yt/ytlib/yql_client/proto/yql_service.proto";

////////////////////////////////////////////////////////////////////////////////

message TClusterInfo
{
    required string cluster_name = 1;
    required string cluster_address = 2;
}

////////////////////////////////////////////////////////////////////////////////

message TUserContext
{
    required string user = 1;
    repeated string groups = 2;
    repeated string tags = 3;
    required bytes attributes = 4; // YSON map
}

////////////////////////////////////////////////////////////////////////////////

message TReqRunQuery
{
    required NYT.NProto.TGuid query_id = 1;
    optional string user = 2 [deprecated = true];
    required bytes credentials = 3; // YSON
    required string query_text = 4;
    required bytes settings = 5; // YSON
    repeated NYT.NYqlClient.NProto.TYqlQueryFile files = 6;
    required int64 mode = 7 [default = 2]; // EExecuteMode
    required int64 query_type = 8 [default = 0]; // EQueryType
    optional bytes query_identity_token = 9;
    required TUserContext user_context = 10;
}

message TRspRunQuery
{
    optional NYT.NYqlClient.NProto.TYqlResponse response = 1;
}

////////////////////////////////////////////////////////////////////////////////

message TReqAbortQuery
{
    required NYT.NProto.TGuid query_id = 1;
}

message TRspAbortQuery
{
    optional bytes error = 1; // YSON
}

////////////////////////////////////////////////////////////////////////////////

message TReqGetQueryProgress
{
    required NYT.NProto.TGuid query_id = 1;
}

message TRspGetQueryProgress
{
    required NYT.NYqlClient.NProto.TYqlResponse response = 1;
}

////////////////////////////////////////////////////////////////////////////////

message TReqGetUsedClusters
{
    required NYT.NProto.TGuid query_id = 1;
    required string query_text = 2;
    required bytes settings = 3; // YSON
    repeated NYT.NYqlClient.NProto.TYqlQueryFile files = 4;
    required TUserContext user_context = 5;
}

message TRspGetUsedClusters
{
    repeated TClusterInfo clusters = 1;
    optional bytes error = 2; // YSON
    optional string default_cluster = 3;
}

////////////////////////////////////////////////////////////////////////////////

message TReqGetClustersInfo
{
    required NYT.NProto.TGuid query_id = 1;
}

message TRspGetClustersInfo
{
    repeated TClusterInfo clusters = 1;
    optional bytes error = 2; // YSON
    optional string default_cluster = 3;
}

////////////////////////////////////////////////////////////////////////////////

message TReqGetDeclaredParametersInfo
{
    required NYT.NProto.TGuid query_id = 1;
    optional string user = 2 [deprecated = true];
    required string query_text = 3;
    required bytes settings = 4; // YSON
    required bytes credentials = 5; // YSON
    optional bytes query_identity_token = 6;
    required TUserContext user_context = 7;
}

message TRspGetDeclaredParametersInfo
{
    required bytes yson_parameters = 1;
}

////////////////////////////////////////////////////////////////////////////////

message TReqRegisterQuery
{
    required NYT.NProto.TGuid query_id = 1;
    required bytes settings = 2; // YSON
}

message TRspRegisterQuery
{
}

////////////////////////////////////////////////////////////////////////////////

message TReqUnregisterQuery
{
    required NYT.NProto.TGuid query_id = 1;
}

message TRspUnregisterQuery
{
}

////////////////////////////////////////////////////////////////////////////////
