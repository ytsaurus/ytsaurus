package NYT.NFileClient.NProto;

import "yt/ytlib/chunk_client/proto/data_source.proto";

import "yt_proto/yt/client/chunk_client/proto/chunk_spec.proto";

import "yt_proto/yt/client/node_tracker_client/proto/node_directory.proto";

import "yt_proto/yt/core/misc/proto/guid.proto";

////////////////////////////////////////////////////////////////////////////////

message TFilePartitionCookie
{
    optional string user = 1;
    optional NYT.NProto.TGuid object_id = 2;
    optional uint64 revision = 3;
    optional NChunkClient.NProto.TDataSource data_source = 4;
    // Chunk specs carry chunk-relative offset limits on boundary chunks.
    repeated NChunkClient.NProto.TChunkSpec chunk_specs = 5;
    optional NNodeTrackerClient.NProto.TNodeDirectory node_directory = 6;
}

////////////////////////////////////////////////////////////////////////////////
