package NYT.NTableClient.NProto;

import "yt_proto/yt/client/table_chunk_format/proto/chunk_meta.proto";

////////////////////////////////////////////////////////////////////////////////

message TRlsReadSpec
{
    message TTrivialDeny
    { }

    oneof predicate_or_trivial_deny {
        string predicate = 1;
        TTrivialDeny trivial_deny = 2;
    }

    optional TTableSchemaExt table_schema = 3;
    optional string authenticated_user = 4;
    // NB(coteeq): If you modify this, don't forget to update TArtifactKey's hash.
}

