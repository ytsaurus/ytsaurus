##
## YT Flow — noop pipeline example.
##
## The Flow services run the released image ghcr.io/ytsaurus/flow (entrypoint flow_server,
## working directory /app/pipeline) with this directory mounted at /app/pipeline, so every
## config is passed by a path relative to it. The role of each flow_server process is set by
## YT_FLOW_MODE; without it, flow_server is the runner.
##
## Services:
##   yt-sync    — one-shot: creates the pipeline node in Cypress (yt_sync.py)
##   controller — flow_server in Controller mode
##   worker,
##   worker2    — flow_server in Worker mode
##   runner     — one-shot: submits pipeline.yson to the controller, then exits
##   prometheus — scrapes controller/worker /solomon_proxy/sensors
##   aggr-rules — generates prometheus recording rules (host="Aggr" aggregates)
##   grafana    — pre-provisioned dashboards over Prometheus
##
## The YT cluster is external: set cluster_url in the YSON configs (see README.md), then pass
## the same HTTP proxy as YT_PROXY for yt-sync:
##
##   YT_PROXY=<http-proxy> YT_TOKEN=<token> docker compose up
##

x-flow-image: &flow-image ghcr.io/ytsaurus/flow:0.3.0

x-flow-node: &flow-node
  image: *flow-image
  restart: on-failure
  network_mode: host
  depends_on:
    yt-sync:
      condition: service_completed_successfully
  volumes:
    - .:/app/pipeline

services:

  # -------------------------------------------------------------------------
  # yt-sync: creates the pipeline node and its system tables before the
  # controller and the workers start.
  # -------------------------------------------------------------------------
  yt-sync:
    image: docker.io/library/python:3.12-slim
    network_mode: host
    working_dir: /app/pipeline
    environment:
      - YT_TOKEN
      - YT_PROXY
      - YT_FLOW_FOLDER
    entrypoint: ["/bin/sh", "-c"]
    command:
      - pip install --quiet --disable-pip-version-check --root-user-action=ignore ytsaurus-flow-yt-sync-mini==0.3.0 && python3 yt_sync.py
    volumes:
      - .:/app/pipeline:ro

  # -------------------------------------------------------------------------
  # Flow Controller. It publishes the host's address; the cluster's RPC proxy
  # connects to it there to deliver the runner's and `yt flow` commands.
  # -------------------------------------------------------------------------
  controller:
    <<: *flow-node
    environment:
      - YT_TOKEN
      - YT_FLOW_MODE=Controller
    command: ["--config", "controller.yson"]

  # -------------------------------------------------------------------------
  # Flow Workers. Host networking rules out compose replicas, so each worker is
  # its own service with its own config and port pair.
  # -------------------------------------------------------------------------
  worker:
    <<: *flow-node
    environment:
      - YT_TOKEN
      - YT_FLOW_MODE=Worker
    command: ["--config", "worker.yson"]

  worker2:
    <<: *flow-node
    environment:
      - YT_TOKEN
      - YT_FLOW_MODE=Worker
    command: ["--config", "worker2.yson"]

  # -------------------------------------------------------------------------
  # Runner (one-shot): submits the spec and starts the pipeline, then exits.
  # -------------------------------------------------------------------------
  runner:
    <<: *flow-node
    depends_on:
      yt-sync:
        condition: service_completed_successfully
      controller:
        condition: service_started
      worker:
        condition: service_started
    environment:
      - YT_TOKEN
      - YT_FLOW_WAIT=0
    command: ["--config", "pipeline.yson"]

  # -------------------------------------------------------------------------
  # Prometheus: scrapes controller (:10001) and workers (:10002, :10003).
  # -------------------------------------------------------------------------
  prometheus:
    image: docker.io/prom/prometheus:latest
    restart: unless-stopped
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
      - "--web.enable-lifecycle"
    volumes:
      - ../../docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
      - prometheus-rules:/rules
      - prometheus-data:/prometheus

  # -------------------------------------------------------------------------
  # Aggregation layer stand-in: generates per-metric recording rules that sum
  # raw series into host="Aggr" series (see ../../docker/monitoring/aggr_rules.py).
  # -------------------------------------------------------------------------
  aggr-rules:
    image: docker.io/library/python:3-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    entrypoint: ["python3", "/app/aggr_rules.py"]
    environment:
      PROMETHEUS_URL: "http://localhost:9090"
      AGGR_RULES_PATH: "/rules/host-aggr.yml"
    volumes:
      - ../../docker/monitoring/aggr_rules.py:/app/aggr_rules.py:ro
      - prometheus-rules:/rules

  # -------------------------------------------------------------------------
  # Grafana: pre-provisioned Prometheus datasource + the flow dashboards.
  # Anonymous admin access, no login. Render the dashboards first with
  # ../../docker/monitoring/grafana/dashboards/generate.sh.
  # -------------------------------------------------------------------------
  grafana:
    image: docker.io/grafana/grafana:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
      PROMETHEUS_PORT: "9090"
    volumes:
      - ../../docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  prometheus-rules:
  grafana-data:
