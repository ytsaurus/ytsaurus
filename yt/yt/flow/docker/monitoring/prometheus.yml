# Prometheus scrape config for a local YT Flow stack.
#
# Flow nodes expose a combined YT Solomon exporter (node + companion) at /solomon_proxy/sensors. It
# picks its output encoding from the request Accept header, and Prometheus' default Accept includes
# "text/plain", which the exporter maps to Prometheus text format.
#
# Scrape targets come from file-based service discovery (targets/*.json), reloaded within
# refresh_interval without a restart.
#
# host label model (matches the flow dashboards):
#   - raw series carry a per-instance host copied from the scrape target;
#   - host="Aggr" series are produced by recording rules generated by the aggr-rules sidecar
#     (aggr_rules.py), standing in for the production monitoring aggregation layer.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /rules/*.yml

scrape_configs:
  - job_name: flow_server
    # /solomon_proxy/sensors is the combined endpoint: the node's own sensors plus its companion's
    # (embedded or external). /solomon/all is only the node leaf and would leave the companion
    # dashboards empty.
    metrics_path: /solomon_proxy/sensors
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/flow_server.json
        refresh_interval: 5s
    metric_relabel_configs:
      - source_labels: [instance]
        target_label: host
      # yt.flow.controller.* sensors are global (leader-only) and carry no host dimension;
      # dashboards query them without a host selector.
      - source_labels: [__name__]
        regex: yt_flow_controller_.*
        target_label: host
        replacement: ""
