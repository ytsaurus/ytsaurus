package NYT.NChaosServer.NProto;

import "yt/server/master/chaos_server/proto/alien_cell.proto";

////////////////////////////////////////////////////////////////////////////////

message TReqUpdateAlienCellPeers
{
    repeated TAlienCellConstellation constellations = 1;
    optional bool full_sync = 2 [default = false];
    optional bool scoped_full_sync = 3 [default = false];
}

message TReqExpireMetadataClusters
{
    repeated string expired_clusters = 1;
}

message TReqReplicateAlienClusterRegistry
{
    repeated string clusters = 1;
}

////////////////////////////////////////////////////////////////////////////////

