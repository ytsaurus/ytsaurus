package NYql;
option java_package = "ru.yandex.yql.proto";
option java_outer_classname = "YtTokenResolverConfig";

message TYqlAgentTokenResolverConfig {
    optional string UnixSocketPath = 1;
    optional uint64 RpcTimeoutMs = 2 [default = 60000];
}

message TYtTokenResolverConfig {
    optional TYqlAgentTokenResolverConfig YqlAgent = 1;
}
