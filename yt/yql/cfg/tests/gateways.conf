# NB(mpereskokova): Counterpart to yt/yql/plugin/config.cpp

Yt {
    GatewayThreads: 0
    YtLogLevel: YL_INFO

    DefaultSettings {
        Name: "DefaultCalcMemoryLimit"
        Value: "1G"
    }

    DefaultSettings {
        Name: "EvaluationTableSizeLimit"
        Value: "1M"
    }

    DefaultSettings {
        Name: "DefaultMaxJobFails"
        Value: "5"
    }

    DefaultSettings {
        Name: "DefaultMemoryLimit"
        Value: "512m"
    }

    DefaultSettings {
        Name: "MapJoinLimit"
        Value: "2048m"
    }

    DefaultSettings {
        Name: "MapJoinShardCount"
        Value: "4"
    }

    DefaultSettings {
        Name: "CommonJoinCoreLimit"
        Value: "128m"
    }

    DefaultSettings {
        Name: "CombineCoreLimit"
        Value: "128m"
    }

    DefaultSettings {
        Name: "SwitchLimit"
        Value: "128m"
    }

    DefaultSettings {
        Name: "JoinMergeTablesLimit"
        Value: "64"
    }

    DefaultSettings {
        Name: "DataSizePerJob"
        Value: "1g"
    }

    DefaultSettings {
        Name: "MaxJobCount"
        Value: "16384"
    }

    DefaultSettings {
        Name: "PublishedCompressionCodec"
        Value: "zstd_5"
    }

    DefaultSettings {
        Name: "TemporaryCompressionCodec"
        Value: "zstd_5"
    }

    DefaultSettings {
        Name: "PublishedErasureCodec"
        Value: "none"
    }

    DefaultSettings {
        Name: "TemporaryErasureCodec"
        Value: "none"
    }

    DefaultSettings {
        Name: "OptimizeFor"
        Value: "scan"
    }

    DefaultSettings {
        Name: "PythonCpu"
        Value: "4.0"
    }

    DefaultSettings {
        Name: "JavascriptCpu"
        Value: "4.0"
    }

    DefaultSettings {
        Name: "ErasureCodecCpu"
        Value: "5.0"
    }

    DefaultSettings {
        Name: "AutoMerge"
        Value: "relaxed"
    }

    DefaultSettings {
        Name: "QueryCacheMode"
        Value: "normal"
    }

    DefaultSettings {
        Name: "QueryCacheSalt"
        Value: "YQLOVERYT-41"
    }

    DefaultSettings {
        Name: "UseSkiff"
        Value: "1"
    }

    DefaultSettings {
        Name: "MaxInputTables"
        Value: "1000"
    }

    DefaultSettings {
        Name: "MaxInputTablesForSortedMerge"
        Value: "100"
    }

    DefaultSettings {
        Name: "MaxOutputTables"
        Value: "50"
    }

    DefaultSettings {
        Name: "InferSchemaTableCountThreshold"
        Value: "50"
    }

    DefaultSettings {
        Name: "MaxExtraJobMemoryToFuseOperations"
        Value: "3g"
    }

    DefaultSettings {
        Name: "UseColumnarStatistics"
        Value: "auto"
    }

    DefaultSettings {
        Name: "ParallelOperationsLimit"
        Value: "16"
    }

    DefaultSettings {
        Name: "ReleaseTempData"
        Value: "immediate"
    }

    DefaultSettings {
        Name: "LookupJoinLimit"
        Value: "1M"
    }

    DefaultSettings {
        Name: "LookupJoinMaxRows"
        Value: "900"
    }

    DefaultSettings {
        Name: "MaxReplicationFactorToFuseOperations"
        Value: "20.0"
    }

    DefaultSettings {
        Name: "LLVMMemSize"
        Value: "256M"
    }

    DefaultSettings {
        Name: "LLVMPerNodeMemSize"
        Value: "10K"
    }

    DefaultSettings {
        Name: "JoinEnableStarJoin"
        Value: "true"
    }

    DefaultSettings {
        Name: "FolderInlineItemsLimit"
        Value: "200"
    }

    DefaultSettings {
        Name: "FolderInlineDataLimit"
        Value: "500K"
    }

    DefaultSettings {
        Name: "WideFlowLimit"
        Value: "101"
    }

    DefaultSettings {
        Name: "NativeYtTypeCompatibility"
        Value: "complex,date,null,void,date,float,json,decimal,uuid"
    }

    DefaultSettings {
        Name: "MapJoinUseFlow"
        Value: "1"
    }

    DefaultSettings {
        Name: "HybridDqDataSizeLimitForOrdered"
        Value: "384M"
    }

    DefaultSettings {
        Name: "HybridDqDataSizeLimitForUnordered"
        Value: "8G"
    }

    DefaultSettings {
        Name: "UseYqlRowSpecCompactForm"
        Value: "false"
    }

    DefaultSettings {
        Name: "UseNewPredicateExtraction"
        Value: "true"
    }

    DefaultSettings {
        Name: "PruneKeyFilterLambda"
        Value: "true"
    }

    DefaultSettings {
        Name: "JoinCommonUseMapMultiOut"
        Value: "true"
    }

    DefaultSettings {
        Name: "UseAggPhases"
        Value: "true"
    }

    DefaultSettings {
        Name: "EnforceJobUtc"
        Value: "true"
    }

    DefaultSettings {
        Name: "_EnforceRegexpProbabilityFail"
        Value: "0"
    }

    DefaultSettings {
        Name: "_ForceJobSizeAdjuster"
        Value: "true"
    }

    DefaultSettings {
        Name: "_EnableWriteReorder"
        Value: "true"
    }

    DefaultSettings {
        Name: "_EnableYtPartitioning"
        Value: "true"
    }

    DefaultSettings {
        Name: "HybridDqExecution"
        Value: "true"
    }

    DefaultSettings {
        Name: "DQRPCReaderInflight"
        Value: "1"
    }

    DefaultSettings {
        Name: "UseNativeYtTypes"
        Value: "true"
    }

    DefaultSettings {
        Name: "UseNativeDynamicTableRead"
        Value: "true"
    }

    DefaultSettings {
        Name: "RuntimeClusterSelection"
        Value: "auto"
    }

    DefaultSettings {
        Name: "_EnableRLSTablesSupport"
        Value: "true"
    }

    DefaultSettings {
        Name: "_EnableDynamicTablesWrite"
        Value: "true"
    }

    RemoteFilePatterns {
        Pattern: "yt://([a-zA-Z0-9\\-_]+)/([^&@?]+)$"
        Cluster: "$1"
        Path: "$2"
    }

    ClusterMapping {
        Name: "${cluster_name}"
        Cluster: "${cluster_address}"
        Default: true

        Settings {
            Name: "_AllowRemoteClusterInput"
            Value: "true"
        }
    }

    ${remote_cluster_mappings}
}

Fs {
    CustomSchemes {
        # backward compatibility rule
        Pattern: "yt://([a-zA-Z0-9\\-_]+)/(.+)@t=([^&=]+)"
        TargetUrl: "yt://$1/$2?transaction_id=$3"
    }
}
