package NYT.NFlow.NProto.NTest;

option java_package = "tech.ytsaurus.flow.test";
option java_multiple_files = true;

message TTestMessage {
    required string id = 1;
    required uint64 time = 2;
    required int64 count = 3;
    required double value = 4;
    required bool is_value = 5;
}

// All fields optional, so an all-default instance builds and serializes to zero bytes.
message TOptionalTestMessage {
    optional int64 count = 1;
}
