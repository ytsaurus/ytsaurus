      - path: yt/docs/ai/artifacts/reference/writing-rules.md
      - path: yt/docs/ai/artifacts/reference/glossary.md
      - path: yt/docs/ai/artifacts/reference/target-audience.md
      - path: yt/docs/ai/artifacts/codebase/codebase-map.md
      - path: docs/yateam/infradocs/guide/structure/headers.md
      - path: docs/yateam/infradocs/guide/structure/links.md
      - path: docs/yateam/infradocs/guide/structure/footnotes.md
      - path: docs/yateam/infradocs/guide/words/general.md
      - path: docs/yateam/infradocs/guide/words/professionals.md
      - path: docs/yateam/infradocs/guide/words/interface.md
      - path: docs/yateam/infradocs/guide/words/terms.md
