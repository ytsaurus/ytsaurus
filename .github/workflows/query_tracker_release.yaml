name: Release query tracker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag like 0.2.3.dev"
        required: true
        type: string
  push:
    tags:
      - 'docker/query-tracker/[0-9]+\.[0-9]+\.[0-9]+*'
      - 'docker-test/query-tracker/[0-9]+\.[0-9]+\.[0-9]+*'

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  start-vm:
    name: Start VM
    runs-on: trampoline
    outputs:
      label: ${{ steps.start-yc-runner.outputs.label }}
      instance-id: ${{ steps.start-yc-runner.outputs.instance-id }}
    steps:
      - name: Start YC runner
        id: start-yc-runner
        uses: yc-actions/yc-github-runner@v2.1.0
        with:
          mode: start
          retry-timeout: PT5M
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          image-id: ${{ vars.YC_DEFAULT_IMAGE_ID }}
          zone-id: ${{ vars.YC_ZONE_ID }}
          subnet-id: ${{ vars.YC_SUBNET_ID }}
          cores: 16
          memory: 32GB
          core-fraction: 100
          disk-type: network-ssd-nonreplicated
          disk-size: 465GB
          user: ${{ secrets.YC_VM_USERNAME }}
          ssh-public-key: ${{ secrets.YC_VM_SSH_PUBLIC_KEY }}
          public-ip: false
          ttl: PT24H
          runner-home-dir: /actions-runner

  tag:
    name: Parse tag
    needs:
      - start-vm
    outputs:
      test-image-tag: ${{ steps.tag.outputs.TEST_IMAGE_TAG }}
      prod-image-tag: ${{ steps.tag.outputs.PROD_IMAGE_TAG }}
      release-type: ${{ steps.tag.outputs.RELEASE_TYPE }}
      version-patch: ${{ steps.tag.outputs.VERSION_PATCH }}
      version-branch: ${{ steps.tag.outputs.VERSION_BRANCH }}
    runs-on: ${{ needs.start-vm.outputs.label }}
    steps:
      - name: Parse tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RELEASE_TYPE=test" >> $GITHUB_OUTPUT
            PROD_IMAGE_TAG="${{ github.event.inputs.tag }}"
          else
            tmp="${GITHUB_REF#refs/*/}"; if [[ "${tmp%%/*}" == "docker-test" ]]
            then
                echo "RELEASE_TYPE=test" >> $GITHUB_OUTPUT
            elif [[ "${tmp%%/*}" == "docker" ]]
            then
                echo "RELEASE_TYPE=prod" >> $GITHUB_OUTPUT
            fi

            PROD_IMAGE_TAG="${tmp#docker/query-tracker/}"
            PROD_IMAGE_TAG="${PROD_IMAGE_TAG#docker-test/query-tracker/}"
          fi

          echo "PROD_IMAGE_TAG=$PROD_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "TEST_IMAGE_TAG=dev-$PROD_IMAGE_TAG" >> $GITHUB_OUTPUT

          if [[ "$PROD_IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.([0-9]+)[.-](.+)$ ]]; then
            VERSION_PATCH="${BASH_REMATCH[1]}"
            VERSION_BRANCH="${BASH_REMATCH[2]}"
          elif [[ "$PROD_IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
            VERSION_PATCH="${BASH_REMATCH[1]}"
            VERSION_BRANCH="stable"
          else
            VERSION_PATCH=$(echo "$PROD_IMAGE_TAG" | awk -F. '{print $3}')
            VERSION_BRANCH="stable"
          fi

          echo "VERSION_PATCH=$VERSION_PATCH" >> "$GITHUB_OUTPUT"
          echo "VERSION_BRANCH=$VERSION_BRANCH" >> "$GITHUB_OUTPUT"

  checkout:
    name: Checkout
    needs:
      - start-vm
      - tag
    runs-on: ${{ needs.start-vm.outputs.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ytsaurus

  build:
    name: Build profile artifacts
    needs:
      - start-vm
      - checkout
      - tag
    if: ${{ needs.tag.outputs.release-type == 'test' }}
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      cpp-build-system: ya-make
      build-types: '["relwithdebinfo"]'
      build-python: true
      build-query-tracker: true
      version-patch: ${{ needs.tag.outputs.version-patch }}
      version-branch: ${{ needs.tag.outputs.version-branch }}
    secrets:
      BUILD_CACHE_BAZEL_USERNAME: ${{ secrets.BUILD_CACHE_BAZEL_USERNAME }}
      BUILD_CACHE_BAZEL_PASSWORD: ${{ secrets.BUILD_CACHE_BAZEL_PASSWORD }}
    uses: ./.github/workflows/build-jobs.yaml

  release-relwithdebinfo:
    name: Release Test (relwithdebinfo)
    needs:
      - start-vm
      - build
      - tag
    if: ${{ needs.tag.outputs.release-type == 'test' }}
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      cpp-build-system: ya-make
      build-types: '["relwithdebinfo"]'
      publish-query-tracker: true
      image-tag: ${{ needs.tag.outputs.test-image-tag }}
      nightly-image-tag: ${{ needs.tag.outputs.test-image-tag }}
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
    uses: ./.github/workflows/docker-jobs.yaml

  clear-caches:
    name: Clear caches
    needs:
      - start-vm
      - release-relwithdebinfo
    runs-on: ${{ needs.start-vm.outputs.label }}
    timeout-minutes: 120
    steps:
      - name: Clear local caches
        run: |
          set -euxo pipefail

          df -h
          ./ytsaurus/ya gc cache \
            --cache-size=0GiB \
            --tools-cache-size=0GiB \
            --symlinks-ttl=0h
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          df -h

  prepare-release:
    name: Prepare release layout and strip artifacts
    needs:
      - start-vm
      - clear-caches
    uses: ./.github/workflows/strip-artifacts.yaml
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      source: ../build_ya-make_relwithdebinfo
      destination: ../build_ya-make_release

  prepare-yql-release:
    name: Prepare YQL release layout and strip artifacts
    needs:
      - start-vm
      - prepare-release
    uses: ./.github/workflows/strip-artifacts.yaml
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      source: ../build_yql_ya-make_relwithdebinfo
      destination: ../build_yql_ya-make_release

  release:
    name: Release Test (release)
    needs:
      - start-vm
      - prepare-release
      - prepare-yql-release
      - tag
    if: ${{ needs.tag.outputs.release-type == 'test' }}
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      cpp-build-system: ya-make
      build-types: '["release"]'
      publish-query-tracker: true
      image-tag: ${{ needs.tag.outputs.test-image-tag }}
      nightly-image-tag: ${{ needs.tag.outputs.test-image-tag }}
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
    uses: ./.github/workflows/docker-jobs.yaml

  push-test-to-prod:
    name: Release Prod
    if: ${{ needs.tag.outputs.release-type == 'prod' }}
    needs:
      - start-vm
      - tag
    runs-on: ${{ needs.start-vm.outputs.label }}
    steps:
      - name: Docker login
        run: |
          echo '${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}' | docker login ghcr.io --username ${{ secrets.GH_USERNAME }} --password-stdin

      - name: Docker Pull And Push (release)
        run: |
          docker pull ghcr.io/ytsaurus/query-tracker-nightly:${{ needs.tag.outputs.test-image-tag }}
          docker tag  ghcr.io/ytsaurus/query-tracker-nightly:${{ needs.tag.outputs.test-image-tag }} \
                      ghcr.io/ytsaurus/query-tracker:${{ needs.tag.outputs.prod-image-tag }}
          docker push ghcr.io/ytsaurus/query-tracker:${{ needs.tag.outputs.prod-image-tag }}

      - name: Docker Pull And Push (relwithdebinfo)
        run: |
          docker pull ghcr.io/ytsaurus/query-tracker-nightly:${{ needs.tag.outputs.test-image-tag }}-relwithdebinfo
          docker tag  ghcr.io/ytsaurus/query-tracker-nightly:${{ needs.tag.outputs.test-image-tag }}-relwithdebinfo \
                      ghcr.io/ytsaurus/query-tracker:${{ needs.tag.outputs.prod-image-tag }}-relwithdebinfo
          docker push ghcr.io/ytsaurus/query-tracker:${{ needs.tag.outputs.prod-image-tag }}-relwithdebinfo

  stop-vm:
    name: Stop VM
    needs:
      - start-vm
      - build
      - release-relwithdebinfo
      - clear-caches
      - prepare-release
      - prepare-yql-release
      - release
      - push-test-to-prod
    runs-on: trampoline
    if: ${{ always() }}
    steps:
      - name: Stop YC runner
        uses: yc-actions/yc-github-runner@v2.1.0
        with:
          mode: stop
          retry-timeout: PT5M
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-vm.outputs.label }}
          instance-id: ${{ needs.start-vm.outputs.instance-id }}

  send-notifications:
    name: Send notifications
    needs:
      - stop-vm
    if: ${{ failure() }}
    uses: ./.github/workflows/send_telegram_notification.yaml
    with:
      notification_type: workflow_failure
      runner: ubuntu-latest
    secrets:
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
