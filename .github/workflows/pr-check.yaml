name: Check PR
on:
  push:
    branches:
      - members/ilyaibraev/YT-28839-ci-cleanup-check-20261020
  workflow_call:
    inputs:
      commit-sha:
        required: true
        type: string

    secrets:
      YA_YT_TOKEN:
        required: true
      YC_SA_JSON_CREDENTIALS:
        required: true
      GH_PERSONAL_ACCESS_TOKEN:
        required: true
      YC_VM_USERNAME:
        required: true
      YC_VM_SSH_PUBLIC_KEY:
        required: true
      S3_ACCESS_KEY:
        required: false
      S3_SECRET_KEY:
        required: false
      BUILD_CACHE_BAZEL_USERNAME:
        required: false
      BUILD_CACHE_BAZEL_PASSWORD:
        required: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: read

jobs:

  notify-start:
    name: Notify PR start
    if: ${{ github.event_name != 'push' }}
    runs-on: trampoline
    permissions:
      issues: write
      pull-requests: write
    outputs:
      comment-id: ${{ steps.notify-pr.outputs.comment-id }}
    steps:
      - name: Notify PR
        id: notify-pr
        uses: actions/github-script@v7
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const current_time = new Date().toLocaleString("ru-RU");
            const message = 'PR autocheck started. Watch workflow progress [here](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).';
            const { data: comment } = await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '`' + current_time + '`' + ' ' + message
            });
            core.setOutput('comment-id', comment.id);

  start-vm:
    name: Start VM
    runs-on: trampoline
    outputs:
      label: ${{ steps.start-yc-runner.outputs.label }}
      instance-id: ${{ steps.start-yc-runner.outputs.instance-id }}
    steps:
      - name: Start YC runner
        id: start-yc-runner
        uses: yc-actions/yc-github-runner@v2.1.0
        with:
          mode: start
          retry-timeout: PT5M
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          image-id: ${{ vars.YC_DEFAULT_IMAGE_ID }}
          zone-id: ${{ vars.YC_ZONE_ID }}
          subnet-id: ${{ vars.YC_SUBNET_ID }}
          cores: 16
          memory: 64GB
          core-fraction: 100
          disk-type: network-ssd-nonreplicated
          disk-size: 744GB
          user: ${{ secrets.YC_VM_USERNAME }}
          ssh-public-key: ${{ secrets.YC_VM_SSH_PUBLIC_KEY }}
          public-ip: false
          ttl: PT24H
          runner-home-dir: /actions-runner
  
  checkout:
    name: Checkout sources
    needs: 
      - start-vm
    runs-on: ${{ needs.start-vm.outputs.label }}
    steps:
      - name: Checkout ytsaurus
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit-sha || github.sha }}
          fetch-depth: 2
          path: ytsaurus
          allow-unsafe-pr-checkout: true

  build-strawberry:
    name: Build Strawberry controller
    permissions:
      contents: read
    with:
      runs-on-value: ubuntu-latest
      checkout-ref: ${{ inputs.commit-sha || github.sha }}
    uses: ./.github/workflows/strawberry-action.yaml

  build-check-cmake:
    name: CMake build and check
    needs:
      - start-vm
      - checkout
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      build-chyt: ${{ github.ref_name == 'main' || github.event_name == 'push' }}
      build-types: '["relwithdebinfo"]'
      run-unittests: true
    secrets:
      BUILD_CACHE_BAZEL_USERNAME: ${{ secrets.BUILD_CACHE_BAZEL_USERNAME }}
      BUILD_CACHE_BAZEL_PASSWORD: ${{ secrets.BUILD_CACHE_BAZEL_PASSWORD }}
    uses: ./.github/workflows/cmake-action.yaml

  cleanup-cmake:
    name: Clean CMake build directories
    needs:
      - start-vm
      - checkout
      - build-check-cmake
    if: ${{ !cancelled() && needs.checkout.result == 'success' }}
    runs-on: ${{ needs.start-vm.outputs.label }}
    timeout-minutes: 30
    steps:
      - name: Upload CMake unit test results
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cmake-unittest-results-${{ github.run_attempt }}
          path: ../build_cmake_relwithdebinfo/junit-*.xml
          if-no-files-found: ignore

      - name: Remove CMake build directories
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euxo pipefail

          df -h .
          df -i .
          for build_dir in ../build_cmake_relwithdebinfo ../build_yql_cmake_relwithdebinfo; do
            if [ -d "$build_dir" ]; then
              du -sh -- "$build_dir"
            fi
            rm -rf -- "$build_dir"
          done
          df -h .
          df -i .

  build-ya-make:
    name: Build with ya-make
    needs:
      - start-vm
      - cleanup-cmake
    if: ${{ !cancelled() && needs.cleanup-cmake.result == 'success' }}
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      cpp-build-system: ya-make
      build-ytsaurus: true
      build-ytsaurus-tests: true
      build-flow-tests: ${{ github.ref_name == 'main' || github.event_name == 'push' }}
      build-query-tracker: ${{ github.ref_name == 'main' || github.event_name == 'push' }}
      build-python: true
      build-types: '["relwithdebinfo"]'
    secrets:
      BUILD_CACHE_BAZEL_USERNAME: ${{ secrets.BUILD_CACHE_BAZEL_USERNAME }}
      BUILD_CACHE_BAZEL_PASSWORD: ${{ secrets.BUILD_CACHE_BAZEL_PASSWORD }}
    uses: ./.github/workflows/build-jobs.yaml

  run-tests:
    name: PR tests
    needs:
      - start-vm
      - build-ya-make
      - notify-start
    if: ${{ !cancelled() && needs.build-ya-make.result == 'success' && (github.event_name == 'push' || needs.notify-start.result == 'success') }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/pr-tests.yaml
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      comment-id: ${{ needs.notify-start.outputs.comment-id }}
    secrets:
      YA_YT_TOKEN: ${{ secrets.YA_YT_TOKEN }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}

  notify-finish:
    name: Notify PR finish
    needs:
      - notify-start
      - run-tests
      - start-vm
      - build-ya-make
      - build-check-cmake
      - cleanup-cmake
      - build-strawberry
    runs-on: trampoline
    permissions:
      issues: write
      pull-requests: write
    if: ${{ always() && github.event_name != 'push' }}
    steps:
      - name: Notify PR
        uses: actions/github-script@v7
        with:
          script: |
            const current_time = new Date().toLocaleString("ru-RU");
            const message = 'PR autocheck finished.\nStatuses:\n'
            const strawberry_status = 'Strawberry controller: ' + '${{ needs.build-strawberry.result }}' + '\n';
            const cmake_status = 'CMake build+check: ' + '${{ needs.build-check-cmake.result }}' + '\n';
            const ya_make_status = 'Ya-make build: ' + '${{ needs.build-ya-make.result }}' + '\n';
            const tests_status = 'Tests: ' + '${{ needs.run-tests.result }}' + '\n';
            const comment = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.notify-start.outputs.comment-id }}
            });
            const comment_body = comment.data.body;
            const new_comment_body = comment_body + '\n' + '`' + current_time + '`' + ' ' + message + strawberry_status + cmake_status + ya_make_status + tests_status;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: ${{ needs.notify-start.outputs.comment-id }},
              body: new_comment_body
            });

  stop-vm:
    name: Stop VM
    needs:
      - start-vm
      - build-ya-make
      - build-check-cmake
      - cleanup-cmake
      - run-tests
      - notify-finish
    runs-on: trampoline
    if: ${{ always() }}
    steps:
      - name: Stop YC runner
        uses: yc-actions/yc-github-runner@v2.1.0
        with:
          mode: stop
          retry-timeout: PT5M
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-vm.outputs.label }}
          instance-id: ${{ needs.start-vm.outputs.instance-id }}
