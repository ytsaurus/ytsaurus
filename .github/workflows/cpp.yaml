name: C++ CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable/[0-9]+\.[0-9]+
      - query-tracker/[0-9]+\.[0-9]+
      - chyt/[0-9]+\.[0-9]+


env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  start-vm:
    name: Start VM
    runs-on: trampoline
    outputs:
      label: ${{ steps.start-yc-runner.outputs.label }}
      instance-id: ${{ steps.start-yc-runner.outputs.instance-id }}
    steps:
      - name: Start YC runner
        id: start-yc-runner
        uses: yc-actions/yc-github-runner@v2.1.0
        with:
          mode: start
          retry-timeout: PT5M
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          image-id: ${{ vars.YC_DEFAULT_IMAGE_ID }}
          zone-id: ${{ vars.YC_ZONE_ID }}
          subnet-id: ${{ vars.YC_SUBNET_ID }}
          cores: 16
          memory: 64GB
          core-fraction: 100
          disk-type: network-ssd-nonreplicated
          disk-size: 837GB
          user: ${{ secrets.YC_VM_USERNAME }}
          ssh-public-key: ${{ secrets.YC_VM_SSH_PUBLIC_KEY }}
          public-ip: false
          ttl: PT36H
          runner-home-dir: /actions-runner

  checkout:
    name: Checkout sources
    needs: start-vm
    runs-on: ${{ needs.start-vm.outputs.label }}
    steps:
      - name: Checkout ytsaurus
        uses: actions/checkout@v4
        with:
          path: ytsaurus
          fetch-depth: 256

  tag:
    name: Calculate docker tag
    needs:
      - start-vm
      - checkout
    runs-on: ${{ needs.start-vm.outputs.label }}
    outputs:
      image-tag: ${{ steps.tag.outputs.IMAGE_TAG }}
      nightly-image-tag: ${{ steps.tag.outputs.NIGHTLY_IMAGE_TAG }}
      version-patch: ${{ steps.tag.outputs.VERSION_PATCH }}
      is-release-branch: ${{ steps.tag.outputs.IS_RELEASE_BRANCH }}
    steps:
      - name: Calculate docker tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IMAGE_TAG=dev-test
          else
            if [[ $GITHUB_REF =~ main$ ]];
            then
              IMAGE_TAG=dev
            elif [[ $GITHUB_REF =~ stable ]];
            then
              IMAGE_TAG=dev-${GITHUB_REF#refs/*/stable/}
            elif [[ $GITHUB_REF =~ "query-tracker" ]];
            then
              IMAGE_TAG=dev-${GITHUB_REF#refs/*/query-tracker/}
            elif [[ $GITHUB_REF =~ "chyt" ]];
            then
              IMAGE_TAG=dev-${GITHUB_REF#refs/*/chyt/}
            else
              IMAGE_TAG=dev-test
            fi
          fi

          NIGHTLY_IMAGE_TAG=${IMAGE_TAG}-$(git -C ytsaurus show -s --pretty=%cs)-${GITHUB_SHA}

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "NIGHTLY_IMAGE_TAG=$NIGHTLY_IMAGE_TAG" >> $GITHUB_OUTPUT

          if [[ $GITHUB_REF =~ ^refs/heads/(stable|query-tracker|chyt)/ ]]; then
            IS_RELEASE_BRANCH=true
          else
            IS_RELEASE_BRANCH=false
          fi
          echo "IS_RELEASE_BRANCH=$IS_RELEASE_BRANCH" >> $GITHUB_OUTPUT

          # Compute VERSION_PATCH as YYMMDDnnn (date of last commit + commit index within that day).
          LAST_COMMIT_DATE=$(git -C ytsaurus log -n 1 --format="%cd" --date=format:"%y%m%d")
          COMMITS_THIS_DAY=$(git -C ytsaurus log --after="20${LAST_COMMIT_DATE} 00:00:00" --oneline | wc -l | tr -d ' ')
          VERSION_PATCH=$(printf "%s%03d" "$LAST_COMMIT_DATE" "$COMMITS_THIS_DAY")
          echo "VERSION_PATCH=$VERSION_PATCH" >> "$GITHUB_OUTPUT"

  build-ya-make:
    name: Build with ya-make
    needs:
      - start-vm
      - checkout
      - tag
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      cpp-build-system: ya-make
      build-ytsaurus: true
      build-ytsaurus-tests: true
      build-flow-tests: ${{ needs.tag.outputs.is-release-branch != 'true' }}
      build-query-tracker: true
      build-python: true
      build-chyt: true
      update-remote-cache: true
      build-types: '["relwithdebinfo"]'
      version-patch: ${{ needs.tag.outputs.version-patch }}
    secrets:
      BUILD_CACHE_BAZEL_USERNAME: ${{ secrets.BUILD_CACHE_BAZEL_USERNAME }}
      BUILD_CACHE_BAZEL_PASSWORD: ${{ secrets.BUILD_CACHE_BAZEL_PASSWORD }}
    uses: ./.github/workflows/build-jobs.yaml

  docker-ya-make-relwithdebinfo:
    name: Docker profile images with ya-make
    needs:
      - start-vm
      - tag
      - build-ya-make
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      cpp-build-system: ya-make
      publish-query-tracker: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'query-tracker/') }}
      publish-ytsaurus: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'stable/') }}
      publish-local: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'stable/') }}
      publish-chyt: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'chyt/') }}
      image-tag: ${{ needs.tag.outputs.image-tag }}
      nightly-image-tag: ${{ needs.tag.outputs.nightly-image-tag }}
      build-types: '["relwithdebinfo"]'
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
    uses: ./.github/workflows/docker-jobs.yaml

  create-task-for-ytsaurus-ci:
    name: Make task for YTsaurus CI
    if: ${{ startsWith(github.ref_name, 'stable/')
          || startsWith(github.ref_name, 'query-tracker/')
          || startsWith(github.ref_name, 'chyt/') }}
    needs:
      - tag
      - docker-ya-make-relwithdebinfo
    uses: ./.github/workflows/ytsaurus-ci-runner.yaml
    with:
      scenario: release-tests
      ref_name: ${{ github.ref_name }}
      image_tag: ${{ needs.tag.outputs.image-tag }}
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      YTSAURUS_CI_K8S_EDITOR_TOKEN: ${{ secrets.YTSAURUS_CI_K8S_EDITOR_TOKEN }}

  check:
    name: Check
    needs:
      - start-vm
      - tag
      - docker-ya-make-relwithdebinfo
    if: ${{ !cancelled() && needs.start-vm.result == 'success' && needs.docker-ya-make-relwithdebinfo.result != 'skipped' }}
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      build-dir: build_ya-make_relwithdebinfo
      run-unittests: true
      run-integration-tests: true
      run-flow-tests: ${{ needs.tag.outputs.is-release-branch != 'true' }}
      run-python-tests: true
      run-odin-tests: true
    uses: ./.github/workflows/check-jobs.yaml

  clear-caches:
    name: Clear caches
    needs:
      - start-vm
      - check
      - docker-ya-make-relwithdebinfo
    if: ${{ !cancelled() && needs.start-vm.result == 'success' && needs.docker-ya-make-relwithdebinfo.result == 'success' }}
    runs-on: ${{ needs.start-vm.outputs.label }}
    timeout-minutes: 120
    steps:
      - name: Clear local caches
        run: |
          set -euxo pipefail

          df -h
          ./ytsaurus/ya gc cache \
            --cache-size=0GiB \
            --tools-cache-size=0GiB \
            --symlinks-ttl=0h
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          df -h

  prepare-release:
    name: Prepare release layout and strip artifacts
    needs:
      - start-vm
      - clear-caches
    if: ${{ !cancelled() && needs.start-vm.result == 'success' && needs.clear-caches.result == 'success' }}
    uses: ./.github/workflows/strip-artifacts.yaml
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      source: ../build_ya-make_relwithdebinfo
      destination: ../build_ya-make_release

  prepare-yql-release:
    name: Prepare YQL release layout and strip artifacts
    needs:
      - start-vm
      - prepare-release
    if: ${{ !cancelled() && needs.start-vm.result == 'success' && needs.prepare-release.result == 'success' }}
    uses: ./.github/workflows/strip-artifacts.yaml
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      source: ../build_yql_ya-make_relwithdebinfo
      destination: ../build_yql_ya-make_release

  docker-ya-make-release:
    name: Docker release images with ya-make
    needs:
      - start-vm
      - tag
      - prepare-release
      - prepare-yql-release
    if: ${{ !cancelled() && needs.start-vm.result == 'success' && needs.tag.result == 'success' && needs.prepare-release.result == 'success' && needs.prepare-yql-release.result == 'success' }}
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      cpp-build-system: ya-make
      publish-query-tracker: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'query-tracker/') }}
      publish-ytsaurus: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'stable/') }}
      publish-local: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'stable/') }}
      publish-chyt: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'chyt/') }}
      image-tag: ${{ needs.tag.outputs.image-tag }}
      nightly-image-tag: ${{ needs.tag.outputs.nightly-image-tag }}
      build-types: '["release"]'
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
    uses: ./.github/workflows/docker-jobs.yaml

  stop-vm:
    name: Stop VM
    needs:
      - start-vm
      - build-ya-make
      - docker-ya-make-relwithdebinfo
      - check
      - clear-caches
      - prepare-release
      - prepare-yql-release
      - docker-ya-make-release
    runs-on: trampoline
    if: ${{ always() }}
    steps:
      - name: Stop YC runner
        uses: yc-actions/yc-github-runner@v2.1.0
        with:
          mode: stop
          retry-timeout: PT5M
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-vm.outputs.label }}
          instance-id: ${{ needs.start-vm.outputs.instance-id }}

  send-alert:
    needs:
      - check
      - build-ya-make
      - docker-ya-make-relwithdebinfo
      - clear-caches
      - prepare-release
      - prepare-yql-release
      - docker-ya-make-release
    if: always()
    uses: ./.github/workflows/check-status-and-send-alert.yaml
    with:
      is_failure: ${{ contains(join(needs.*.result, ','), 'failure') }}
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
