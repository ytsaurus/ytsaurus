name: C++ CI

on:
  workflow_dispatch:
    inputs:
      build_types:
        description: 'JSON array containing both "release" and "relwithdebinfo"'
        required: false
        default: '["relwithdebinfo","release"]'
        type: string
  push:
    branches:
      - main
      - stable/[0-9]+\.[0-9]+
      - query-tracker/[0-9]+\.[0-9]+
      - chyt/[0-9]+\.[0-9]+
      - members/ilyaibraev/yt-28839-cpp-profile-release-workflow


env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  start-vm:
    name: Start VM
    runs-on: trampoline
    outputs:
      label: ${{ steps.start-yc-runner.outputs.label }}
      instance-id: ${{ steps.start-yc-runner.outputs.instance-id }}
    steps:
      - name: Start YC runner
        id: start-yc-runner
        uses: yc-actions/yc-github-runner@v2.1.0
        with:
          mode: start
          retry-timeout: PT5M
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          image-id: ${{ vars.YC_DEFAULT_IMAGE_ID }}
          zone-id: ${{ vars.YC_ZONE_ID }}
          subnet-id: ${{ vars.YC_SUBNET_ID }}
          cores: 16
          memory: 64GB
          core-fraction: 100
          disk-type: network-ssd-nonreplicated
          disk-size: 837GB
          user: ${{ secrets.YC_VM_USERNAME }}
          ssh-public-key: ${{ secrets.YC_VM_SSH_PUBLIC_KEY }}
          public-ip: false
          ttl: PT36H
          runner-home-dir: /actions-runner

  checkout:
    name: Checkout sources
    needs: start-vm
    runs-on: ${{ needs.start-vm.outputs.label }}
    steps:
      - name: Checkout ytsaurus
        uses: actions/checkout@v4
        with:
          path: ytsaurus
          fetch-depth: 256

  tag:
    name: Calculate docker tag
    needs:
      - start-vm
      - checkout
    runs-on: ${{ needs.start-vm.outputs.label }}
    outputs:
      image-tag: ${{ steps.tag.outputs.IMAGE_TAG }}
      nightly-image-tag: ${{ steps.tag.outputs.NIGHTLY_IMAGE_TAG }}
      build-types: ${{ steps.tag.outputs.BUILD_TYPES }}
      version-patch: ${{ steps.tag.outputs.VERSION_PATCH }}
    steps:
      - name: Calculate docker tag
        id: tag
        env:
          REQUESTED_BUILD_TYPES: ${{ github.event.inputs.build_types }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IMAGE_TAG=dev-test
          else
            if [[ $GITHUB_REF =~ main$ ]];
            then
              IMAGE_TAG=dev
            elif [[ $GITHUB_REF =~ stable ]];
            then
              IMAGE_TAG=dev-${GITHUB_REF#refs/*/stable/}
            elif [[ $GITHUB_REF =~ "query-tracker" ]];
            then
              IMAGE_TAG=dev-${GITHUB_REF#refs/*/query-tracker/}
            elif [[ $GITHUB_REF =~ "chyt" ]];
            then
              IMAGE_TAG=dev-${GITHUB_REF#refs/*/chyt/}
            else
              IMAGE_TAG=dev-test
            fi
          fi

          NIGHTLY_IMAGE_TAG=${IMAGE_TAG}-$(git -C ytsaurus show -s --pretty=%cs)-${GITHUB_SHA}

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "NIGHTLY_IMAGE_TAG=$NIGHTLY_IMAGE_TAG" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if ! jq -e \
              'type == "array" and length == 2 and sort == ["release", "relwithdebinfo"]' \
              <<< "$REQUESTED_BUILD_TYPES" > /dev/null;
            then
              echo 'build_types must contain exactly "release" and "relwithdebinfo"' >&2
              exit 1
            fi
          fi
          echo 'BUILD_TYPES=["relwithdebinfo","release"]' >> "$GITHUB_OUTPUT"

          # Compute VERSION_PATCH as YYMMDDnnn (date of last commit + commit index within that day).
          LAST_COMMIT_DATE=$(git -C ytsaurus log -n 1 --format="%cd" --date=format:"%y%m%d")
          COMMITS_THIS_DAY=$(git -C ytsaurus log --after="20${LAST_COMMIT_DATE} 00:00:00" --oneline | wc -l | tr -d ' ')
          VERSION_PATCH=$(printf "%s%03d" "$LAST_COMMIT_DATE" "$COMMITS_THIS_DAY")
          echo "VERSION_PATCH=$VERSION_PATCH" >> "$GITHUB_OUTPUT"

  build-ya-make:
    name: Build with ya-make
    needs:
      - start-vm
      - checkout
      - tag
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      cpp-build-system: ya-make
      build-ytsaurus: true
      build-ytsaurus-tests: true
      build-query-tracker: true
      build-python: true
      build-chyt: true
      update-remote-cache: true
      build-types: '["relwithdebinfo"]'
      version-patch: ${{ needs.tag.outputs.version-patch }}
    secrets:
      BUILD_CACHE_BAZEL_USERNAME: ${{ secrets.BUILD_CACHE_BAZEL_USERNAME }}
      BUILD_CACHE_BAZEL_PASSWORD: ${{ secrets.BUILD_CACHE_BAZEL_PASSWORD }}
    uses: ./.github/workflows/build-jobs.yaml

  docker-ya-make-relwithdebinfo:
    name: Docker profile images with ya-make
    needs:
      - start-vm
      - tag
      - build-ya-make
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      cpp-build-system: ya-make
      publish-query-tracker: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'query-tracker/') || github.ref_name == 'members/ilyaibraev/yt-28839-cpp-profile-release-workflow' }}
      publish-ytsaurus: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'stable/') || github.ref_name == 'members/ilyaibraev/yt-28839-cpp-profile-release-workflow' }}
      publish-local: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'stable/') || github.ref_name == 'members/ilyaibraev/yt-28839-cpp-profile-release-workflow' }}
      publish-chyt: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'chyt/') || github.ref_name == 'members/ilyaibraev/yt-28839-cpp-profile-release-workflow' }}
      image-tag: ${{ needs.tag.outputs.image-tag }}
      nightly-image-tag: ${{ needs.tag.outputs.nightly-image-tag }}
      build-types: '["relwithdebinfo"]'
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
    uses: ./.github/workflows/docker-jobs.yaml

  create-task-for-ytsaurus-ci:
    name: Make task for YTsaurus CI
    if: ${{ startsWith(github.ref_name, 'stable/')
          || startsWith(github.ref_name, 'query-tracker/')
          || startsWith(github.ref_name, 'chyt/') }}
    needs:
      - tag
      - docker-ya-make-release
    uses: ./.github/workflows/ytsaurus-ci-runner.yaml
    with:
      scenario: release-tests
      ref_name: ${{ github.ref_name }}
      image_tag: ${{ needs.tag.outputs.image-tag }}
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      YTSAURUS_CI_K8S_EDITOR_TOKEN: ${{ secrets.YTSAURUS_CI_K8S_EDITOR_TOKEN }}

  check:
    name: Check
    needs:
      - start-vm
      - docker-ya-make-relwithdebinfo
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      build-dir: build_ya-make_relwithdebinfo
      run-unittests: true
      run-integration-tests: true
      run-flow-tests: true
      run-python-tests: true
      run-odin-tests: true
    uses: ./.github/workflows/check-jobs.yaml

  prepare-release:
    name: Prepare release artifacts
    needs:
      - start-vm
      - check
    runs-on: ${{ needs.start-vm.outputs.label }}
    timeout-minutes: 120
    steps:
      - name: Clear local caches
        run: |
          set -euxo pipefail

          df -h
          ./ytsaurus/ya gc cache \
            --cache-size=0GiB \
            --tools-cache-size=0GiB \
            --symlinks-ttl=0h
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          df -h

      - name: Strip profile artifacts
        run: |
          set -euxo pipefail

          for prefix in build_ya-make build_yql_ya-make; do
            profile_dir="../${prefix}_relwithdebinfo"
            release_dir="../${prefix}_release"
            test -d "$profile_dir"
            test ! -e "$release_dir"
            mv "$profile_dir" "$release_dir"
          done

          ytsaurus_build_path=../build_ya-make_release
          yql_build_path=../build_yql_ya-make_release
          artifacts=(
            "$ytsaurus_build_path/yt/yt/server/all/ytserver-all"
            "$ytsaurus_build_path/yt/chyt/server/bin/ytserver-clickhouse"
            "$ytsaurus_build_path/yt/chyt/trampoline/clickhouse-trampoline"
            "$ytsaurus_build_path/yt/python/yt/environment/bin/init_operations_archive/init-operations-archive"
            "$ytsaurus_build_path/yt/python/yt/environment/bin/init_queue_agent_state/init_queue_agent_state"
            "$ytsaurus_build_path/yt/python/yt/environment/bin/init_query_tracker_state/init_query_tracker_state"
            "$yql_build_path/yt/yql/agent/bin/ytserver-yql-agent"
            "$yql_build_path/yt/yql/tools/mrjob/mrjob"
            "$yql_build_path/yt/yql/dq_vanilla_job/dq_vanilla_job"
            "$yql_build_path/yt/yql/dq_vanilla_job.lite/dq_vanilla_job.lite"
          )

          shopt -s nullglob
          yql_libraries=("$yql_build_path/yql_shared_libraries/yql/"*.so)
          if [ "${#yql_libraries[@]}" -eq 0 ]; then
            echo "No YQL shared libraries found" >&2
            exit 1
          fi
          artifacts+=("${yql_libraries[@]}")

          strip_tool=$(command -v strip)
          for artifact in "${artifacts[@]}"; do
            test -f "$artifact"
            "$strip_tool" --strip-unneeded "$artifact"
            artifact_type=$(file "$artifact")
            echo "$artifact_type"
            if [[ "$artifact_type" != *stripped* ]]; then
              echo "Artifact was not stripped: $artifact" >&2
              exit 1
            fi
          done

  docker-ya-make-release:
    name: Docker release images with ya-make
    needs:
      - start-vm
      - tag
      - prepare-release
    with:
      runs-on-value: ${{ needs.start-vm.outputs.label }}
      cpp-build-system: ya-make
      publish-query-tracker: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'query-tracker/') || github.ref_name == 'members/ilyaibraev/yt-28839-cpp-profile-release-workflow' }}
      publish-ytsaurus: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'stable/') || github.ref_name == 'members/ilyaibraev/yt-28839-cpp-profile-release-workflow' }}
      publish-local: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'stable/') || github.ref_name == 'members/ilyaibraev/yt-28839-cpp-profile-release-workflow' }}
      publish-chyt: ${{ github.ref_name == 'main' || startsWith(github.ref_name, 'chyt/') || github.ref_name == 'members/ilyaibraev/yt-28839-cpp-profile-release-workflow' }}
      image-tag: ${{ needs.tag.outputs.image-tag }}
      nightly-image-tag: ${{ needs.tag.outputs.nightly-image-tag }}
      build-types: '["release"]'
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
    uses: ./.github/workflows/docker-jobs.yaml

  stop-vm:
    name: Stop VM
    needs:
      - start-vm
      - build-ya-make
      - docker-ya-make-relwithdebinfo
      - check
      - prepare-release
      - docker-ya-make-release
    runs-on: trampoline
    if: ${{ always() }}
    steps:
      - name: Stop YC runner
        uses: yc-actions/yc-github-runner@v2.1.0
        with:
          mode: stop
          retry-timeout: PT5M
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-vm.outputs.label }}
          instance-id: ${{ needs.start-vm.outputs.instance-id }}

  send-alert:
    needs:
      - check
      - build-ya-make
      - docker-ya-make-relwithdebinfo
      - prepare-release
      - docker-ya-make-release
    if: always()
    uses: ./.github/workflows/check-status-and-send-alert.yaml
    with:
      is_failure: ${{ contains(join(needs.*.result, ','), 'failure') }}
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
