name: PR notifications

on:
  pull_request_target:
    branches:
      - main
      - stable/[0-9]+\.[0-9]+
    types:
      - opened

permissions: {}

jobs:
  pr-notifications:
    name: Send PR notifications
    uses: ./.github/workflows/send_telegram_notification.yaml
    with:
      notification_type: pull_request
      runner: ubuntu-latest
    secrets:
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFICATIONS_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
