name: PR notifications

on:
  pull_request_target:
    branches:
      - main
      - stable/[0-9]+\.[0-9]+
    types:
      - opened

permissions: {}

jobs:
  pr-notifications:
    name: Send PR notifications
    runs-on: ubuntu-latest
    steps:
      - name: Send telegram message
        shell: bash
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFICATIONS_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          NOTIFICATION_TITLE: ${{ github.event.pull_request.title }}
          NOTIFICATION_URL: ${{ github.event.pull_request.html_url }}
        run: |
          printf -v message 'New PR in %s: %s\n%s' \
            "$REPOSITORY" "$NOTIFICATION_TITLE" "$NOTIFICATION_URL"

          curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode 'link_preview_options={"is_disabled":true}' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
