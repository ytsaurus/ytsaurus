name: Docs Auto Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths: 'yt/docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      src-root: "./yt/docs"
      build-root: "./_docs-build"
      lint-root: "./_docs-lint"
      revision: "${{ github.sha }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout SPYT examples
        uses: actions/checkout@v4
        with:
          repository: ytsaurus/ytsaurus-spyt
          ref: f3cc97cd1aa9acb5c2f98a54f11e0c53d5b90cf2
          path: yt/spark/spark-over-yt
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install diplodoc
        run: |
          npm install -g @diplodoc/cli@stable
          npm install -g @diplodoc/algolia-extension
        shell: bash

      - name: Check docs sources
        run: bash .github/scripts/check_docs_sources.sh "$GITHUB_WORKSPACE"
        shell: bash

      - name: Delete search index
        run: bash .github/scripts/delete_search_index.sh ${{ secrets.ALGOLIA_APP_ID }} ${{ secrets.ALGOLIA_API_KEY }}

      - name: Build doc md2html
        id: build-md2html
        env:
          index-name: "ytsaurus-docs"
        run: |
          set -o pipefail
          exitcode=0
          yfm -i ${{ env.src-root }} -o ${{ env.lint-root }} --arcadia-root "$GITHUB_WORKSPACE" --extensions "$(npm root -g)/@diplodoc/algolia-extension" --index-name ${{ env.index-name }}-${{ env.revision }} --api-key ${{ secrets.ALGOLIA_API_KEY }} --app-id ${{ secrets.ALGOLIA_APP_ID }}  2>&1 | tee './build-html.log' || exitcode=$?

          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
        shell: bash


      - name: Build md2md
        id: build-md2md
        run: |
          set -o pipefail
          exitcode=0
          yfm -i ${{ env.src-root }} -o ${{ env.build-root }} --arcadia-root "$GITHUB_WORKSPACE" --output-format md --add-map-file --allow-custom-resources 2>&1 | tee './build-md.log' || exitcode=$?
          rm -rf "${{ env.build-root }}/.ya-make-input"

          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Save inputs
        run: |
          mkdir -p ./inputs
          echo ${{ env.revision }} > ./inputs/revision
          echo ${{ github.event.number }} > ./inputs/pr-number
        shell: bash

      - name: Upload inputs
        uses: actions/upload-artifact@v4
        with:
          name: inputs
          path: inputs/
          include-hidden-files: true
          retention-days: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-md
          include-hidden-files: true
          path: ${{ env.build-root }}
          retention-days: 1

      - name: Upload build html doc
        uses: actions/upload-artifact@v4
        with:
          name: build-output-html
          path: ${{ env.lint-root }}
          retention-days: 1

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-html
          path: ./build-html.log
          retention-days: 1

      - name: Exit
        run: |
          html_exitcode=${{ steps.build-md2html.outputs.exitcode }}
          md_exitcode=${{ steps.build-md2md.outputs.exitcode }}

          if [ "$html_exitcode" -eq 0 ] && [ "$md_exitcode" -eq 0 ]; then
              echo "Build exited successfully."
          else
            echo "Build exited with an error. HTML exit code: $html_exitcode, MD exit code: $md_exitcode"
            exit 1
          fi
        shell: bash

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Upload
        uses: diplodoc-platform/docs-upload-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-endpoint: ${{ vars.DIPLODOC_STORAGE_ENDPOINT }}
          storage-region: ${{ vars.DIPLODOC_STORAGE_REGION }}
          storage-bucket: ${{ vars.DIPLODOC_STORAGE_BUCKET }}
          storage-access-key-id: ${{ secrets.DIPLODOC_ACCESS_KEY_ID }}
          storage-secret-access-key: ${{ secrets.DIPLODOC_SECRET_ACCESS_KEY }}

  release:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - name: Release
        uses: diplodoc-platform/docs-release-action@v2
        with:
          revision: "${{ github.sha }}"
          storage-bucket: "${{ vars.DIPLODOC_STORAGE_BUCKET }}"
          storage-access-key-id: ${{ secrets.DIPLODOC_ACCESS_KEY_ID }}
          storage-secret-access-key: ${{ secrets.DIPLODOC_SECRET_ACCESS_KEY }}
          server: "https://viewer.ydocs.io"
          project-link: https://ytsaurus.viewer.ydocs.io
